name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Train and evaluate
        run: |
          clinical-ner train --reports 400 --epochs 15
          clinical-ner evaluate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinical-ner .
      - name: Smoke test the API
        run: |
          docker run -d -p 8000:8000 --name api clinical-ner
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/extract -H 'Content-Type: application/json' \
            -d '{"text": "Ferritin (30-300) ug/L 85", "engine": "model"}' | tee out.json
          grep -q FERR out.json
